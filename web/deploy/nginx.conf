# Dbt Admin Console — statik yayın.
#
# Tek koşul SPA fallback'tir: bilinmeyen yollar index.html'e döner. Gerisi önbellek disiplini.
#
# Bu dosya hem Dockerfile'daki nginx imajında hem de mevcut bir nginx'e dahil edilerek kullanılabilir.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bu bir iç yönetim aracı: arama motorlarına ve iframe'e kapalı.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Vite hash'li dosya adı üretiyor (index-Bv1nj_Cs.js): içerik değişince ad da değişir,
    # bu yüzden süresiz önbelleğe alınabilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # index.html, service worker ve manifest ASLA önbelleğe alınmaz.
    #
    # Neden: bunlar hash'siz sabit adlar. Tarayıcı eski index.html'i önbellekten servis ederse
    # silinmiş hash'li dosyalara bakar ve uygulama bembeyaz açılır. sw.js önbelleğe alınırsa
    # kurulu PWA güncellemeyi hiç görmez — yayın yapılır ama kimse yeni sürümü almaz.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate" always;
        types { }
        default_type application/manifest+json;
    }

    # Android paketi. İndirme linki uygulamanın yanında dursun ki sürüm tek yerden dağıtılsın.
    location = /dbt-admin.apk {
        add_header Content-Disposition 'attachment; filename="dbt-admin.apk"' always;
        add_header Cache-Control "no-cache" always;
        default_type application/vnd.android.package-archive;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
